[project]
name = "exploratory-data-analysis"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "appnope",
    "asttokens",
    "attrs",
    "choreographer",
    "comm",
    "debugpy",
    "notebook",
    "decorator",
    "duckdb",
    "executing",
    "fastjsonschema",
    "iniconfig",
    "ipykernel",
    "ipython",
    "ipython_pygments_lexers",
    "jedi",
    "jsonschema",
    "jsonschema-specifications",
    "jupyter_client",
    "jupyter_core",
    "kaleido",
    "logistro",
    "matplotlib-inline",
    "narwhals",
    "nbformat",
    "nest-asyncio",
    "numpy",
    "orjson",
    "packaging",
    "pandas",
    "parso",
    "pexpect",
    "platformdirs",
    "plotly",
    "pluggy",
    "prompt_toolkit",
    "psutil",
    "ptyprocess",
    "pure_eval",
    "pyarrow",
    "Pygments",
    "pytest",
    "pytest-timeout",
    "python-dateutil",
    "pytz",
    "pyzmq",
    "referencing",
    "rpds-py",
    "simplejson",
    "six",
    "stack-data",
    "tornado",
    "traitlets",
    "typing_extensions",
    "tzdata",
    "wcwidth"
]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/exploratory_data_analysis"]
